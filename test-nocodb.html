<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NocoDB连接测试</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .config-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            box-sizing: border-box;
        }
        
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        
        .test-button {
            background: #2196F3;
        }
        
        .test-button:hover {
            background: #1976D2;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        
        .success {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4CAF50;
        }
        
        .error {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid #f44336;
        }
        
        .info {
            background: rgba(33, 150, 243, 0.3);
            border: 1px solid #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗄️ NocoDB连接测试</h1>
        
        <div class="config-section">
            <h3>📋 配置NocoDB连接</h3>
            
            <div class="form-group">
                <label for="baseURL">NocoDB服务地址:</label>
                <input type="url" id="baseURL" value="https://app.nocodb.com" placeholder="https://app.nocodb.com">
            </div>
            
            <div class="form-group">
                <label for="projectId">项目ID:</label>
                <input type="text" id="projectId" placeholder="输入你的NocoDB项目ID">
            </div>
            
            <div class="form-group">
                <label for="apiToken">API Token:</label>
                <input type="text" id="apiToken" placeholder="输入你的NocoDB API Token">
            </div>
            
            <button onclick="saveConfig()">💾 保存配置</button>
            <button onclick="loadConfig()" class="test-button">🔄 加载配置</button>
        </div>
        
        <div class="config-section">
            <h3>🧪 连接测试</h3>
            <button onclick="testConnection()" class="test-button">🔗 测试连接</button>
            <button onclick="testCreateTable()" class="test-button">📊 测试创建表</button>
            <button onclick="testCRUD()" class="test-button">👩 添加小美记录</button>
            <button onclick="clearResults()">🗑️ 清空结果</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script src="config/nocodb-config.js"></script>
    <script src="js/nocodb-client.js"></script>
    <script>
        let nocoClient = null;

        // 保存配置
        function saveConfig() {
            const config = {
                baseURL: document.getElementById('baseURL').value,
                projectId: document.getElementById('projectId').value,
                apiToken: document.getElementById('apiToken').value
            };
            
            localStorage.setItem('nocodb-config', JSON.stringify(config));
            
            // 更新客户端配置
            if (nocoClient) {
                nocoClient.baseURL = config.baseURL;
                nocoClient.projectId = config.projectId;
                nocoClient.apiToken = config.apiToken;
            }
            
            showResult('✅ 配置已保存到本地存储', 'success');
        }

        // 加载配置
        function loadConfig() {
            const saved = localStorage.getItem('nocodb-config');
            if (saved) {
                const config = JSON.parse(saved);
                document.getElementById('baseURL').value = config.baseURL || '';
                document.getElementById('projectId').value = config.projectId || '';
                document.getElementById('apiToken').value = config.apiToken || '';
                
                showResult('✅ 配置已从本地存储加载', 'success');
            } else {
                showResult('⚠️ 未找到保存的配置', 'info');
            }
        }

        // 初始化客户端
        function initClient() {
            const config = {
                baseURL: document.getElementById('baseURL').value,
                projectId: document.getElementById('projectId').value,
                apiToken: document.getElementById('apiToken').value
            };
            
            if (!config.baseURL || !config.projectId || !config.apiToken) {
                throw new Error('请填写完整的NocoDB配置信息');
            }
            
            nocoClient = new NocoDBClient();
            nocoClient.baseURL = config.baseURL;
            nocoClient.projectId = config.projectId;
            nocoClient.apiToken = config.apiToken;
            
            return nocoClient;
        }

        // 测试连接
        async function testConnection() {
            try {
                showResult('🔄 正在测试NocoDB连接...', 'info');
                
                const client = initClient();
                const result = await client.healthCheck();
                
                if (result.success) {
                    showResult(`✅ NocoDB连接成功！\n时间: ${result.timestamp}`, 'success');
                } else {
                    showResult(`❌ NocoDB连接失败: ${result.error}`, 'error');
                }
                
            } catch (error) {
                showResult(`❌ 连接测试失败: ${error.message}`, 'error');
            }
        }

        // 测试创建表
        async function testCreateTable() {
            try {
                showResult('🔄 正在测试表创建...', 'info');
                
                const client = initClient();
                
                // 这里需要使用NocoDB的表创建API
                // 注意：实际使用时需要根据NocoDB API文档调整
                showResult('⚠️ 表创建测试需要在NocoDB界面手动创建\n请在NocoDB中创建以下表：\n1. users\n2. game_records', 'info');
                
            } catch (error) {
                showResult(`❌ 表创建测试失败: ${error.message}`, 'error');
            }
        }

        // 测试CRUD操作 - 添加小美的记录
        async function testCRUD() {
            try {
                showResult('🔄 正在测试CRUD操作 - 添加小美的记录...', 'info');

                const client = initClient();

                // 创建小美的记录
                const xiaomeiData = {
                    name: '小美',
                    gender: '女',
                    ID_Number: '110101199001011234',
                    Phone: '13800138000'
                };

                const registerResult = await client.registerUser(xiaomeiData);

                if (registerResult.success) {
                    showResult(`✅ 小美的记录创建成功！\n记录详情: ${JSON.stringify(registerResult.user, null, 2)}`, 'success');
                } else {
                    showResult(`❌ 小美的记录创建失败: ${registerResult.error}`, 'error');
                }

            } catch (error) {
                showResult(`❌ CRUD测试失败: ${error.message}`, 'error');
            }
        }

        // 显示结果
        function showResult(message, type) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            resultsDiv.appendChild(resultDiv);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        // 清空结果
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        // 页面加载时自动加载配置
        window.addEventListener('load', () => {
            loadConfig();
            showResult('📋 NocoDB测试页面已加载\n请配置连接信息后进行测试', 'info');
        });
    </script>
</body>
</html>
